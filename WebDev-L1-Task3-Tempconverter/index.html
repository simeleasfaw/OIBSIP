<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tempora — Temperature Converter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="container">
      <section class="converter-card">
        <button
          id="themeToggle"
          class="theme-toggle"
          aria-label="Toggle dark mode"
        >
          <span id="themeIcon">☾</span>
        </button>
        <div class="header">
          <div class="temperature-icon">°</div>

          <p class="eyebrow">TEMPERATURE TOOL</p>

          <h1>
            Convert the
            <span>temperature.</span>
          </h1>

          <p class="description">
            A simple and elegant way to convert temperatures between Celsius,
            Fahrenheit, and Kelvin.
          </p>
        </div>

        <form id="converterForm">
          <div class="input-group">
            <label for="temperature"> Temperature </label>

            <div class="input-wrapper">
              <input
                type="number"
                id="temperature"
                placeholder="Enter a value"
                step="any"
                autocomplete="off"
              />

              <span class="degree-symbol">°</span>
            </div>
          </div>

          <div class="input-group">
            <label for="unit"> Convert from </label>

            <div class="select-wrapper">
              <select id="unit">
                <option value="celsius">Celsius (°C)</option>

                <option value="fahrenheit">Fahrenheit (°F)</option>

                <option value="kelvin">Kelvin (K)</option>
              </select>

              <span class="select-arrow">⌄</span>
            </div>
          </div>

          <button type="submit" class="convert-btn">
            <span>Convert temperature</span>

            <span class="arrow">→</span>
          </button>
        </form>

        <div id="message" class="message"></div>

        <section id="results" class="results hidden">
          <div class="results-header">
            <div>
              <p class="results-label">YOUR RESULTS</p>
              <h2>Converted temperatures</h2>
            </div>

            <div class="sparkle">✦</div>
          </div>

          <div class="result-grid">
            <div class="result-box">
              <div class="result-top">
                <span class="result-icon celsius-icon">°C</span>
                <span class="result-unit">CELSIUS</span>
              </div>

              <strong id="celsiusResult">0.00</strong>

              <span class="result-symbol">°C</span>
            </div>

            <div class="result-box">
              <div class="result-top">
                <span class="result-icon fahrenheit-icon">°F</span>
                <span class="result-unit">FAHRENHEIT</span>
              </div>

              <strong id="fahrenheitResult">0.00</strong>

              <span class="result-symbol">°F</span>
            </div>

            <div class="result-box">
              <div class="result-top">
                <span class="result-icon kelvin-icon">K</span>
                <span class="result-unit">KELVIN</span>
              </div>

              <strong id="kelvinResult">0.00</strong>

              <span class="result-symbol">K</span>
            </div>
          </div>
        </section>

        <footer>
          <span>Built with</span>
          <span class="heart">♥</span>
          <span>HTML · CSS · JavaScript</span>
        </footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
